version: '3.8'

networks:
  paypal-network:
    driver: bridge
services:
  # API Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - TZ=Asia/Kolkata  # <-- ADD THIS LINE
    command: [ "nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf" ]
    depends_on:
      - auth-service
      - payment-service
      - notification-service
    networks:
      - paypal-network

  # Authentication Service
  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - TZ=Asia/Kolkata  # <-- ADD THIS LINE
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    networks:
      - paypal-network

  # Payment Service  
  payment-service:
    build: ./payment-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - AUTH_SERVICE_URL=http://auth-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - TZ=Asia/Kolkata  # <-- ADD THIS LINE
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    depends_on:
      - auth-service
      - notification-service
    networks:
      - paypal-network

  # Notification Service
  notification-service:
    build: ./notification-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - TZ=Asia/Kolkata  # <-- ADD THIS LINE
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    networks:
      - paypal-network
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    networks:
      - paypal-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - paypal-network
    depends_on:
      - zookeeper
    ports:
      # This exposes Kafka to your host machine (Fedora)
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # This advertises Kafka inside the Docker network
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Auto-create our topics
      KAFKA_TOPIC_WHITELIST: "app-logs,docker-events,network-flows"


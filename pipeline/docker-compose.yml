# docker-compose.yml
# 'version' is deprecated and safely removed.

services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - paypal-network
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "application-logs:1:1,network-logs:1:1,container-logs:1:1"
    depends_on:
      - zookeeper
    networks:
      - paypal-network
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - KAFKA_BROKER=kafka:9092
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    depends_on:
      - kafka
    networks:
      - paypal-network
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - KAFKA_BROKER=kafka:9092
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    depends_on:
      - kafka
    networks:
      - paypal-network
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - AUTH_SERVICE_URL=http://auth-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - KAFKA_BROKER=kafka:9092
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    depends_on:
      - auth-service
      - notification-service
      - kafka
    networks:
      - paypal-network
    restart: unless-stopped

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
    command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    depends_on:
      - auth-service
      - payment-service
      - notification-service
    networks:
      - paypal-network
    restart: unless-stopped

  python-scripts:
    container_name: python-scripts
    image: python:3.9
    working_dir: /app
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - KAFKA_BROKER=kafka:9092
    networks:
      - paypal-network
    command: bash -c "pip install kafka-python requests docker && tail -f /dev/null"
    restart: unless-stopped

  # Sandbox containers for mitigation testing
  sandbox-api-gateway:
    image: nginx:alpine
    container_name: sandbox-api-gateway
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
    command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    networks:
      - paypal-network
    restart: unless-stopped

  sandbox-auth-service:
    build: ./auth-service
    container_name: sandbox-auth-service
    ports:
      - "3011:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - KAFKA_BROKER=kafka:9092
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    depends_on:
      - kafka
    networks:
      - paypal-network
    restart: unless-stopped

  sandbox-payment-service:
    build: ./payment-service
    container_name: sandbox-payment-service
    ports:
      - "3012:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - AUTH_SERVICE_URL=http://sandbox-auth-service:3001
      - NOTIFICATION_SERVICE_URL=http://sandbox-notification-service:3003
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - KAFKA_BROKER=kafka:9092
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    depends_on:
      - sandbox-auth-service
      - kafka
    networks:
      - paypal-network
    restart: unless-stopped

  sandbox-notification-service:
    build: ./notification-service
    container_name: sandbox-notification-service
    ports:
      - "3013:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - KAFKA_BROKER=kafka:9092
    volumes:
      - /tmp/jwt-secret.key:/run/secrets/jwt-secret:ro
    depends_on:
      - kafka
    networks:
      - paypal-network
    restart: unless-stopped

networks:
  paypal-network:
    driver: bridge

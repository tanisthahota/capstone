# nginx.conf - runtime DNS resolution + safer proxy defaults

events {
    worker_connections 1024;
}

http {
    # Use Docker's embedded DNS so nginx can resolve container names at runtime
    # valid=10s tells nginx to re-resolve every 10 seconds
    resolver 127.0.0.11 valid=10s;

    # Enhanced logging format
    log_format detailed_logs '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time" '
                            'upstream_addr="$upstream_addr" '
                            'forwarded_for="$http_x_forwarded_for" '
                            'auth="$http_authorization"';

    # Global logging
    access_log /var/log/nginx/access.log detailed_logs;
    error_log /var/log/nginx/error.log debug;

    # sensible proxy defaults (tweak timeouts as you see fit)
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        listen 80;

        # API Gateway health (returns JSON)
        location = /api/health {
            add_header Content-Type application/json always;
            return 200 '{"status":"healthy","service":"api-gateway"}';
        }

        # ----------------------------
        # Auth service routes
        # ----------------------------
        location /api/auth/ {
            # variable forces nginx to resolve at request time
            set $upstream "auth-service:3001";
            proxy_pass http://$upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body on;
            proxy_set_header Content-Type $content_type;

            # upstream logging
            access_log /var/log/nginx/auth.log detailed_logs;
        }

        # ----------------------------
        # Payment service routes
        # ----------------------------
        location /api/payment/ {
            set $upstream "payment-service:3002";
            proxy_pass http://$upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            access_log /var/log/nginx/payment.log detailed_logs;
        }

        # ----------------------------
        # Notification service routes
        # ----------------------------
        location /api/notification/ {
            set $upstream "notification-service:3003";
            proxy_pass http://$upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            access_log /var/log/nginx/notification.log detailed_logs;
        }

        # ----------------------------
        # Catch-all
        # ----------------------------
        location / {
            add_header Content-Type application/json always;
            return 404 '{"error":"Route not found","available_routes":["/api/auth/","/api/payment/","/api/notification/"]}';
        }
    }
}

---
# This playbook stops a running Docker container.

- name: Stop a Docker Container
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    # Force Ansible to use the *correct python interpreter*
    ansible_python_interpreter: /usr/local/bin/python3

    target_container_name: "none"

  tasks:
    - name: "Fail if target_container_name is not set"
      fail:
        msg: "The 'target_container_name' must be set."
      when: target_container_name == 'none'

    - name: "Ensure docker + requests are installed for this interpreter"
      pip:
        name:
          - docker
          - requests
        state: present

    - name: "Stop the compromised container"
      community.docker.docker_container:
        name: "{{ target_container_name }}"
        state: stopped
        stop_timeout: 10
      register: docker_state

    - name: "Report stop action"
      debug:
        msg: "Container {{ target_container_name }} has been stopped."
      when: docker_state.changed

